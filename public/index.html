                    <h2>🎯 什么是生成模型？</h2>
                    <p>
                        <strong>生成模型（Generative Model）</strong> 是指能够学习数据的概率分布规律，并据此生成与真实数据相似的新样本的模型。
                    </p>
                    <p>
                        与判别模型（Discriminative Model）不同，生成模型不仅学习输入和输出之间的映射关系 P(Y|X)，
                        而是学习数据的<strong>联合分布 P(X, Y)</strong>。
                    </p>
